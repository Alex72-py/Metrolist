name: Verify PR 4462

on:
  push:
    branches: ["ci/verify-pr-4462"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests and FOSS debug assembly
        run: ./gradlew --console=plain --continue :innertube:test :app:testFossDebugUnitTest :app:assembleFossDebug --warning-mode summary
        env:
          PULL_REQUEST: "true"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            innertube/build/reports/tests/
            innertube/build/test-results/
